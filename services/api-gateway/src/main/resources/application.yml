server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**
            - id: payment-ledger-service
              uri: ${PAYMENT_LEDGER_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/payments/**
            - id: realtime-broker-service
              uri: ${REALTIME_BROKER_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/stream/**

aegis:
  gateway:
    auth:
      auth-service-base-url: ${AUTH_SERVICE_URL:http://localhost:8081}
      issuer: ${JWT_ISSUER:aegis-auth-service}
      audience: ${JWT_AUDIENCE:aegis-api}
      jwks-cache-ttl: 6h
      jwks-refresh-interval: 30m
      jwks-min-refresh-cooldown: 30s
      jwks-warm-up-initial-backoff: 1s
      jwks-warm-up-max-backoff: 30s
      blacklist-timeout: 200ms
      permit-all-paths:
        - /api/v1/auth/challenge
        - /api/v1/auth/token
      blocked-paths:
        - /api/v1/auth/jwks

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,jwks
  # Trace export는 management.opentelemetry.tracing.export.otlp.endpoint를 지정해야 켜진다(지정 전에는 span을 내보내지 않음).
  # OTLP 메트릭 push는 기본값이 켜짐 + localhost:4318이라 Collector가 없으면 오류 로그만 남는다. 메트릭 수집 방식은 M7에서 정한다.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  tracing:
    sampling:
      # 샘플링 결정은 Collector(tail sampling)에서 한다(ARCHITECTURE 5장). 앱은 모두 기록해서 넘긴다.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
