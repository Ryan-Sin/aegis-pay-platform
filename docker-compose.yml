services:
  mysql:
    image: mysql:8.4
    ports:
      # 호스트 3306은 다른 MySQL과 겹치기 쉬워서 3307을 기본으로 쓴다.
      - "${AEGIS_MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: aegis
      MYSQL_PASSWORD: aegis_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u aegis -paegis_password --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8.0-alpine
    ports:
      - "6379:6379"
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey_data:/data
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - aegis-net

  # JWT 서명키용 KMS(ADR-0006). 2026.03.0부터 auth token이 필요해서 토큰 없이 동작하는 마지막 4.x로 고정한다.
  # 키는 ready.d 스크립트가 기동 때마다 만든다(무료 버전은 상태를 저장하지 않으므로 재기동하면 키 material이 바뀐다).
  localstack:
    image: localstack/localstack:4.14.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: kms
      # init 스크립트(awslocal)가 키를 만드는 리전. auth-service의 aegis.auth.kms.region과 같아야 한다.
      AWS_DEFAULT_REGION: ap-northeast-2
    volumes:
      - ./infra/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    networks:
      - aegis-net
    healthcheck:
      test: ["CMD-SHELL", "curl -s localhost:4566/_localstack/init/ready | grep -q '\"completed\": *true'"]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  aegis-net:
    driver: bridge

volumes:
  mysql_data:
  valkey_data:
